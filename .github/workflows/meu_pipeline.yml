name: Executar Pipeline de Financas

# Define quando o pipeline vai rodar
on:
  schedule:
    # Roda todos os dias às 21:00 UTC (18:00 no horário de Brasília)
    - cron: '0 21 * * *'
  workflow_dispatch: # Permite que clique num botão no GitHub para rodar manualmente quando quiser

permissions:
  contents: write # Permite que o workflow escreva de volta no repositório (para salvar o banco de dados atualizado)

jobs:
  rodar-pipeline:
    runs-on: ubuntu-latest

    steps:
    # 1. Copia os arquivos do seu repositório para a máquina virtual do GitHub
    - name: Copiar código do repositório
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }} # Usa o token do GitHub para acessar o repositório

    # 2. Configura o ambiente Python na máquina do GitHub
    - name: Configurar o Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. Instala as bibliotecas necessárias (pandas e requests)
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Executa o seu script Python para apanhar os dados novos e salvar no SQLite
    - name: Executar o script de dados
      run: python src/pipeline.py

    # 5. Guarda o arquivo financas.db atualizado de volta no seu GitHub
    - name: Salvar dados atualizados no repositório
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/financas.db
        git commit -m "auto: atualização diária de cotações [skip ci]" || echo "Sem alterações para salvar"
        git push origin main
        